{% extends "base.html" %}
{% block title %}Sign in · HireBoard{% endblock %}

{% block content %}
<div class="auth-shell">
  <div class="auth-panel">
    <div class="auth-top">
      <a class="auth-back" href="{{ url_for('index_view') }}">← HireBoard</a>
      <button class="theme-toggle" type="button" data-theme-toggle>dark mode</button>
    </div>
    <div class="brand-wordmark">HireBoard<span class="brand-dot">.</span></div>
    <p class="auth-tagline">Sign in to continue</p>

    <form method="POST" action="{{ url_for('login_action_ajax') }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div class="d-grid gap-2 mb-3">
        <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('register_view') }}">Create an account</a>
      </div>
    </form>

    {% for message in get_flashed_messages(request) %}
    <div class="alert alert-{{ message.type | e }} mb-0" role="alert">{{ message.message | e }}</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
